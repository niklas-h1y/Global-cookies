<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Cookie Clicker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2c1654 0%, #12072b 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            max-width: 450px;
            width: 100%;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
            background: linear-gradient(45deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            font-size: 0.9rem;
            color: #b3a4d4;
            margin-bottom: 30px;
        }
        .score-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 16px;
            margin-bottom: 30px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.05);
        }
        .score-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #a29bfe;
        }
        .score-number {
            font-size: 3rem;
            font-weight: bold;
            color: #fff;
            margin-top: 5px;
            text-shadow: 0 0 10px rgba(162, 155, 254, 0.5);
        }
        .cookie-wrapper {
            position: relative;
            display: inline-block;
            margin: 20px 0;
        }
        #cookie {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.05s ease, box-shadow 0.1s ease;
            user-select: none;
            -webkit-user-drag: none;
        }
        #cookie:hover {
            transform: scale(1.03);
            box-shadow: 0 15px 35px rgba(230, 126, 34, 0.4);
        }
        #cookie:active {
            transform: scale(0.95);
        }
        .status-footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #6c5ce7;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .indicator {
            width: 8px;
            height: 8px;
            background-color: #00b894;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #00b894;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Global Clicker</h1>
        <div class="subtitle">Every player across the world clicks together</div>

        <div class="score-box">
            <div class="score-label">Total Clicks</div>
            <div class="score-number" id="scoreDisplay">Loading...</div>
        </div>

        <div class="cookie-wrapper">
            <!-- Using a high-quality vector cookie icon so it always displays cleanly without broken images -->
            <img id="cookie" src="https://unsplash.com" alt="Cookie">
        </div>

        <div class="status-footer">
            <span class="indicator"></span> Live Multiplayer Database Connected
        </div>
    </div>

    <script>
        const scoreDisplay = document.getElementById('scoreDisplay');
        const cookieImg = document.getElementById('cookie');
        
        // This links everyone to the exact same visual scoring room.
        const ROOM_NAME = "niklas_global_clicker_v2"; 

        // 1. Fetch current live score from public backend
        async function fetchGlobalScore() {
            try {
                const response = await fetch(`https://counterapi.dev{ROOM_NAME}/clicks`);
                const data = await response.json();
                if(data.value !== undefined) {
                    scoreDisplay.innerText = Number(data.value).toLocaleString();
                }
            } catch (err) {
                console.error("Database connection issue:", err);
            }
        }

        // 2. Click handler (Saves instantly to the public tracker server)
        cookieImg.addEventListener('click', async () => {
            // UI responds instantly
            let current = parseInt(scoreDisplay.innerText.replace(/,/g, '')) || 0;
            scoreDisplay.innerText = (current + 1).toLocaleString();

            try {
                // Instantly update the universal database count up by 1
                const response = await fetch(`https://counterapi.dev{ROOM_NAME}/clicks/up`);
                const data = await response.json();
                scoreDisplay.innerText = Number(data.value).toLocaleString();
            } catch (err) {
                console.error("Save click failed:", err);
            }
        });

        // Initialize score right away
        fetchGlobalScore();

        // Refresh database every 2.5 seconds so you can see friends click live!
        setInterval(fetchGlobalScore, 2500);
    </script>
</body>
</html>
