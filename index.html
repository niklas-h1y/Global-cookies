<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Cookie Clicker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f7f7f7;
            padding: 50px;
        }
        #cookie {
            width: 200px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        #cookie:active {
            transform: scale(0.9);
        }
        .setup-box {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            max-width: 400px;
            margin: 0 auto 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        input {
            width: 80%;
            padding: 8px;
            margin: 10px 0;
        }
        button {
            padding: 8px 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Configuration Setup (Hidden after connecting) -->
    <div id="setup" class="setup-box">
        <h3>GitHub Configuration</h3>
        <p><small>Your token stays safely in your own browser's memory.</small></p>
        <input type="password" id="token" placeholder="GitHub Personal Access Token (PAT)">
        <input type="text" id="owner" placeholder="GitHub Username">
        <input type="text" id="repo" placeholder="Repository Name">
        <br>
        <button id="connectBtn">Connect to Global Score</button>
    </div>

    <!-- The Game Interface -->
    <div id="game" style="display: none;">
        <h1>Global Cookie Clicker</h1>
        <h2>Global Clicks: <span id="scoreDisplay">Loading...</span></h2>
        <img id="cookie" src="https://wikimedia.org" alt="Cookie">
        <p>Every click updates the repository instantly for everyone!</p>
    </div>

    <script>
        let CONFIG = { token: '', owner: '', repo: '', path: 'score.json' };
        let currentScore = 0;
        let fileSha = ''; // GitHub requires the file's current SHA hash to update it

        const setupDiv = document.getElementById('setup');
        const gameDiv = document.getElementById('game');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const cookieImg = document.getElementById('cookie');

        // 1. Connect and start the game loop
        document.getElementById('connectBtn').addEventListener('click', async () => {
            CONFIG.token = document.getElementById('token').value;
            CONFIG.owner = document.getElementById('owner').value;
            CONFIG.repo = document.getElementById('repo').value;

            if (!CONFIG.token || !CONFIG.owner || !CONFIG.repo) {
                alert("Please fill out all configuration fields.");
                return;
            }

            setupDiv.style.display = 'none';
            gameDiv.style.display = 'block';

            // Initial fetch and start sync interval (refresh every 5 seconds)
            await fetchGlobalScore();
            setInterval(fetchGlobalScore, 5000);
        });

        // 2. Fetch the current score from GitHub
        async function fetchGlobalScore() {
            const url = `https://github.com{CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.path}`;
            try {
                const response = await fetch(url, {
                    headers: { 'Authorization': `token ${CONFIG.token}` }
                });

                if (response.status === 404) {
                    // File doesn't exist yet, assume score is 0
                    currentScore = 0;
                    scoreDisplay.innerText = currentScore;
                    return;
                }

                const data = await response.json();
                fileSha = data.sha; // Save the file version identifier
                
                const decoded = atob(data.content);
                const scoreData = JSON.parse(decoded);
                
                currentScore = scoreData.clicks || 0;
                scoreDisplay.innerText = currentScore;
            } catch (err) {
                console.error("Error fetching score:", err);
            }
        }

        // 3. Update the score when the cookie is clicked
        cookieImg.addEventListener('click', async () => {
            currentScore++;
            scoreDisplay.innerText = currentScore; // Update UI immediately

            const url = `https://github.com{CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.path}`;
            const newContent = btoa(JSON.stringify({ clicks: currentScore }));

            try {
                const response = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${CONFIG.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: "Cookie clicked!",
                        content: newContent,
                        sha: fileSha // Tells GitHub we are modifying the specific version we fetched
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    fileSha = data.content.sha; // Update the version tracker for the next click
                }
            } catch (err) {
                console.error("Error saving score:", err);
            }
        });
    </script>
</body>
</html>
