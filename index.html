<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safe Global Cookie Clicker</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f7f7f7; padding: 50px; }
        #cookie { width: 200px; cursor: pointer; transition: transform 0.1s; }
        #cookie:active { transform: scale(0.9); }
    </style>
</head>
<body>

    <h1>Safe Global Cookie Clicker</h1>
    <h2>Global Clicks: <span id="scoreDisplay">Loading...</span></h2>
    <img id="cookie" src="https://wikimedia.org" alt="Cookie">
    <p>Completely safe! Clicks trigger an internal GitHub Action server script to update the score file.</p>

    <script>
        const OWNER = "niklas-h1y";
        const REPO = "Global-cookies";
        const scoreDisplay = document.getElementById('scoreDisplay');
        const cookieImg = document.getElementById('cookie');

        // 1. Fetch the score visually from the repository (Publicly readable)
        async function fetchGlobalScore() {
            // We fetch the raw file directly without any API or tokens required!
            const url = `https://githubusercontent.com{OWNER}/${REPO}/main/score.json`;
            try {
                const response = await fetch(url);
                if (response.ok) {
                    const data = await response.json();
                    scoreDisplay.innerText = data.clicks;
                } else {
                    scoreDisplay.innerText = "0 (Click to start!)";
                }
            } catch (err) {
                scoreDisplay.innerText = "0";
            }
        }

        // 2. Click handler triggers the backend automation script
        cookieImg.addEventListener('click', async () => {
            // Optimistic update so the game feels responsive
            let current = parseInt(scoreDisplay.innerText) || 0;
            scoreDisplay.innerText = current + 1;

            // Trigger the internal GitHub Action workflow publicly
            const url = `https://github.com{OWNER}/${REPO}/dispatches`;
            try {
                await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/vnd.github+json'
                    },
                    body: JSON.stringify({
                        event_type: "cookie_clicked"
                    })
                });
            } catch (err) {
                console.error("Failed to send click:", err);
            }
        });

        // Load the score immediately and check for updates every 5 seconds
        fetchGlobalScore();
        setInterval(fetchGlobalScore, 5000);
    </script>
</body>
</html>
