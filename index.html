<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Cookie Clicker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f7f7f7;
            padding: 50px;
        }
        #cookie {
            width: 200px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        #cookie:active {
            transform: scale(0.9);
        }
    </style>
</head>
<body>

    <h1>Global Cookie Clicker</h1>
    <h2>Global Clicks: <span id="scoreDisplay">Loading...</span></h2>
    <img id="cookie" src="https://wikimedia.org" alt="Cookie">
    <p>No login required! Every click updates the score instantly for everyone globally.</p>

    <script>
        const scoreDisplay = document.getElementById('scoreDisplay');
        const cookieImg = document.getElementById('cookie');
        
        // This acts as your public room name. Change "niklas_global_cookie_2026" 
        // to any unique text you want so other developers don't overwrite your score!
        const ROOM_NAME = "niklas_global_cookie_2026"; 

        // 1. Fetch the absolute total score from the global database
        async function fetchGlobalScore() {
            try {
                const response = await fetch(`https://counterapi.dev{ROOM_NAME}/clicks`);
                const data = await response.json();
                if(data.value !== undefined) {
                    scoreDisplay.innerText = data.value;
                }
            } catch (err) {
                console.error("Error reading database:", err);
            }
        }

        // 2. Register a click to the global database
        cookieImg.addEventListener('click', async () => {
            // Optimistic UI update: increase visually right away so clicking feels fast
            let current = parseInt(scoreDisplay.innerText) || 0;
            scoreDisplay.innerText = current + 1;

            try {
                // Tells the database server to add 1 to your global count
                const response = await fetch(`https://counterapi.dev{ROOM_NAME}/clicks/up`);
                const data = await response.json();
                scoreDisplay.innerText = data.value; // Sync with server value
            } catch (err) {
                console.error("Error saving click:", err);
            }
        });

        // Start the game by loading the current score
        fetchGlobalScore();

        // Refresh the score every 3 seconds so you can see other players clicking live!
        setInterval(fetchGlobalScore, 3000);
    </script>
</body>
</html>
