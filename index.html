<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Cookie Clicker (Sicher & Schnell)</title>
    <!-- Offizielle Supabase-Bibliothek laden -->
    <script src="https://jsdelivr.net"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1c1c24 0%, #111115 100%);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            overflow: hidden;
        }
        .container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 100%;
            position: relative;
            z-index: 2;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 5px;
            color: #3ecf8e; /* Supabase Grün */
            text-shadow: 0 0 10px rgba(62, 207, 142, 0.2);
        }
        .subtitle {
            font-size: 0.85rem;
            color: #888893;
            margin-bottom: 25px;
        }
        .score-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }
        .score-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #3ecf8e;
        }
        .score-number {
            font-size: 3rem;
            font-weight: bold;
            margin-top: 5px;
        }
        .cookie-container {
            position: relative;
            display: inline-block;
            margin: 10px 0;
        }
        #cookie {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.05s ease;
            user-select: none;
            -webkit-user-drag: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        #cookie:hover {
            transform: scale(1.04);
            box-shadow: 0 15px 30px rgba(62, 207, 142, 0.2);
        }
        #cookie:active {
            transform: scale(0.92) rotate(-3deg); /* Saftige Schüttel-Animation beim Klicken */
        }
        .status {
            margin-top: 25px;
            font-size: 0.75rem;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .dot {
            width: 8px;
            height: 8px;
            background-color: #3ecf8e;
            border-radius: 50%;
            box-shadow: 0 0 8px #3ecf8e;
        }
        /* Styling für die fliegenden +1 Nummern */
        .floating-text {
            position: absolute;
            color: #3ecf8e;
            font-size: 1.5rem;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
            z-index: 10;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-100px) scale(1.2); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Global Clicker</h1>
        <div class="subtitle">Sicher geschützt via Supabase Row-Level Security</div>

        <div class="score-box">
            <div class="score-label">Globale Klicks</div>
            <div class="score-number" id="scoreDisplay">Lade...</div>
        </div>

        <div class="cookie-container" id="cookieContainer">
            <img id="cookie" src="https://unsplash.com" alt="Keks">
        </div>

        <div class="status"><span class="dot"></span> 100% Sicherer Datenbank-Tunnel aktiv</div>
    </div>

    <script>
        // Deine exakten Supabase Verbindungsdaten (Vollkommen sicher im HTML!)
        const SUPABASE_URL = "https://supabase.com/dashboard/project/uqtikzxplvhixaekvorj";
        // HIER DEINEN KOPIERTEN ANON-KEY ZWISCHEN DIE ANFÜHRUNGSZEICHEN EINFÜGEN:
        const SUPABASE_ANON_KEY = "sb_publishable_UYjHWtMZDvm9TuQtSHjluw_zCO3eLqX";

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const scoreDisplay = document.getElementById('scoreDisplay');
        const cookieImg = document.getElementById('cookie');
        const cookieContainer = document.getElementById('cookieContainer');

        // 1. Live-Score aus deiner gesicherten SQL-Tabelle abfragen
        async function getLiveScore() {
            try {
                const { data, error } = await supabase
                    .from('global_scores')
                    .select('clicks')
                    .eq('id', 'cookie_game')
                    .single();
                
                if (data) {
                    scoreDisplay.innerText = Number(data.clicks).toLocaleString();
                }
            } catch (err) {
                console.error("Fehler beim Abrufen des Scores:", err);
            }
        }

        // 2. Klick-Event: Ruft die geschützte Datenbank-Funktion (+1) auf
        cookieImg.addEventListener('click', async (e) => {
            // Optimistisches UI-Update: Erhöht den Wert sofort visuell für flüssiges Gefühl
            let current = parseInt(scoreDisplay.innerText.replace(/,/g, '')) || 0;
            scoreDisplay.innerText = (current + 1).toLocaleString();

            // Fliegenden +1 Text erzeugen
            createFloatingText(e.clientX, e.clientY);

            // Sendet den Klick an den sicheren Supabase-Server
            const { error } = await supabase.rpc('increment_cookie');
            if (error) console.error("Klick konnte nicht gespeichert werden:", error);
        });

        // Funktion für den fliegenden Klick-Effekt
        function createFloatingText(x, y) {
            const text = document.createElement('div');
            text.className = 'floating-text';
            text.innerText = '+1';
            
            // Position relativ zum Keks-Container berechnen
            const rect = cookieContainer.getBoundingClientRect();
            text.style.left = `${x - rect.left}px`;
            text.style.top = `${y - rect.top}px`;

            cookieContainer.appendChild(text);

            // Nach der Animation das Element löschen, um RAM zu sparen
            setTimeout(() => { text.remove(); }, 800);
        }

        // Punktestand direkt beim Laden holen
        getLiveScore();

        // Alle 3 Sekunden prüfen, ob andere Spieler weltweit geklickt haben
        setInterval(getLiveScore, 3000);
    </script>
</body>
</html>
